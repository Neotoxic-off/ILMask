<svg xmlns="http://www.w3.org/2000/svg" width="500" height="170" viewBox="0 0 500 170" role="img" aria-labelledby="title desc">
  <title id="title">ILMask</title>
  <desc id="desc">IL code on the left, a theater mask emoji on a vertical cut in the middle, and the IDA-style mask on the right: 02, 7B ?? ?? ?? ??, 2A.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa657" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffa657"/>
    </linearGradient>
  </defs>

  <rect width="500" height="170" rx="18" fill="url(#background)"/>

  <!-- IL side -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="22" y="60"><tspan fill="#8b949e">IL_0000:</tspan><tspan fill="#79c0ff"> ldarg.0</tspan></text>
    <text x="22" y="95"><tspan fill="#8b949e">IL_0001:</tspan><tspan fill="#79c0ff"> ldfld</tspan><tspan fill="#d2a8ff"> _value</tspan></text>
    <text x="22" y="130"><tspan fill="#8b949e">IL_0006:</tspan><tspan fill="#79c0ff"> ret</tspan></text>
  </g>

  <!-- The cut, with the mask emoji on it -->
  <line x1="250" y1="12" x2="250" y2="50" stroke="url(#cut)" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="130" x2="250" y2="158" stroke="url(#cut)" stroke-width="3" stroke-linecap="round" transform="rotate(180 250 144)"/>
  <text x="250" y="111" text-anchor="middle" font-size="58">🎭</text>

  <!-- Mask side -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="295" y="41" width="30" height="28" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="310" y="60" fill="#e6edf3">02</text>

    <rect x="295" y="76" width="30" height="28" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="310" y="95" fill="#e6edf3">7B</text>
    <rect x="331" y="76" width="30" height="28" rx="6" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-dasharray="3 2"/>
    <text x="346" y="95" fill="#ffa657">??</text>
    <rect x="367" y="76" width="30" height="28" rx="6" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-dasharray="3 2"/>
    <text x="382" y="95" fill="#ffa657">??</text>
    <rect x="403" y="76" width="30" height="28" rx="6" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-dasharray="3 2"/>
    <text x="418" y="95" fill="#ffa657">??</text>
    <rect x="439" y="76" width="30" height="28" rx="6" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-dasharray="3 2"/>
    <text x="454" y="95" fill="#ffa657">??</text>

    <rect x="295" y="111" width="30" height="28" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="310" y="130" fill="#e6edf3">2A</text>
  </g>
</svg>
