<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">ILMask</title>
  <desc id="desc">IL code on the left is cut by a vertical line into an IDA-style mask on the right: 02, 7B ?? ?? ?? ??, 2A.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa657" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#ffa657"/>
      <stop offset="0.85" stop-color="#f78166"/>
      <stop offset="1" stop-color="#f78166" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-10%" width="500%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="900" height="330" rx="24" fill="url(#background)"/>

  <!-- IL code -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
    <text x="50" y="96"><tspan fill="#8b949e">IL_0000:</tspan><tspan fill="#79c0ff"> ldarg.0</tspan></text>
    <text x="50" y="146"><tspan fill="#8b949e">IL_0001:</tspan><tspan fill="#79c0ff"> ldfld</tspan><tspan fill="#d2a8ff"> Foo::_value</tspan></text>
    <text x="50" y="196"><tspan fill="#8b949e">IL_0006:</tspan><tspan fill="#79c0ff"> ret</tspan></text>
  </g>

  <!-- The cut -->
  <line x1="450" y1="36" x2="450" y2="236" stroke="url(#cut)" stroke-width="8" filter="url(#glow)" opacity="0.7"/>
  <line x1="450" y1="36" x2="450" y2="236" stroke="url(#cut)" stroke-width="3"/>
  <path d="M443 52 L450 40 L457 52 Z" fill="#ffa657"/>
  <path d="M443 220 L450 232 L457 220 Z" fill="#f78166"/>

  <!-- The mask, shifted a little as if sliced off -->
  <g transform="translate(0 6)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" text-anchor="middle">
    <rect x="496" y="65" width="48" height="36" rx="7" fill="#21262d" stroke="#30363d"/>
    <text x="520" y="90" fill="#e6edf3">02</text>

    <rect x="496" y="115" width="48" height="36" rx="7" fill="#21262d" stroke="#30363d"/>
    <text x="520" y="140" fill="#e6edf3">7B</text>
    <rect x="556" y="115" width="48" height="36" rx="7" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-dasharray="4 3"/>
    <text x="580" y="140" fill="#ffa657">??</text>
    <rect x="616" y="115" width="48" height="36" rx="7" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-dasharray="4 3"/>
    <text x="640" y="140" fill="#ffa657">??</text>
    <rect x="676" y="115" width="48" height="36" rx="7" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-dasharray="4 3"/>
    <text x="700" y="140" fill="#ffa657">??</text>
    <rect x="736" y="115" width="48" height="36" rx="7" fill="#ffa657" fill-opacity="0.12" stroke="#ffa657" stroke-dasharray="4 3"/>
    <text x="760" y="140" fill="#ffa657">??</text>

    <rect x="496" y="165" width="48" height="36" rx="7" fill="#21262d" stroke="#30363d"/>
    <text x="520" y="190" fill="#e6edf3">2A</text>
  </g>

  <!-- Name -->
  <text x="450" y="284" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700"><tspan fill="#79c0ff">IL</tspan><tspan fill="#ffa657">Mask</tspan></text>
  <text x="450" y="310" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">IDA-style masks for .NET IL code</text>
</svg>
